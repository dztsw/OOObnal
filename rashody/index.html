<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Защита: страница может загружать и отправлять данные только на свой же сайт -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Расходы</title>
<meta name="theme-color" content="#fff4e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1222" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расходы">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ---------- тема: солнечная днём, тёплый вечер в тёмном режиме ---------- */
:root{
  color-scheme: light;
  --bg:#fff4e6; --card:rgba(255,255,255,.74); --card-solid:#fffaf4; --ink:#2b1c12; --ink2:#6e5444; --muted:#a3887a;
  --line:rgba(140,90,50,.13); --base:rgba(140,90,50,.28); --ring:rgba(140,90,50,.12);
  --accent:#ff7a2f; --accent-strong:#d9520a; --accent-soft:#ffe2c9; --on-accent:#fff;
  --good:#1fa65a; --good-ink:#13773f; --warn:#f5a300; --bad:#e5484d;
  --hero:linear-gradient(135deg,#ffb03a 0%,#ff7a45 45%,#ff5480 100%);
  --hero-bad:linear-gradient(135deg,#ff7b5c 0%,#e5484d 60%,#b8325e 100%);
  --b1:#ffc56b; --b2:#ff8fa3; --b3:#ffe08a; --b4:#9fd8ff; --blob-op:.55;
  --shadow:0 2px 6px rgba(160,90,30,.06),0 10px 30px rgba(160,90,30,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1c1222; --card:rgba(46,30,52,.62); --card-solid:#2a1c30; --ink:#fff4ea; --ink2:#e6cbb8; --muted:#a88f86;
    --line:rgba(255,215,185,.12); --base:rgba(255,215,185,.25); --ring:rgba(255,215,185,.12);
    --accent:#ff8a3d; --accent-strong:#ffb27a; --accent-soft:rgba(255,138,61,.22);
    --good-ink:#3fd07f; --hero:linear-gradient(135deg,#ff9a3c 0%,#f2604f 50%,#c2407e 100%);
    --b1:#ff7a2f; --b2:#b8407e; --b3:#ffb03a; --b4:#5a4fcf; --blob-op:.32; --shadow:0 10px 30px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1c1222; --card:rgba(46,30,52,.62); --card-solid:#2a1c30; --ink:#fff4ea; --ink2:#e6cbb8; --muted:#a88f86;
  --line:rgba(255,215,185,.12); --base:rgba(255,215,185,.25); --ring:rgba(255,215,185,.12);
  --accent:#ff8a3d; --accent-strong:#ffb27a; --accent-soft:rgba(255,138,61,.22);
  --good-ink:#3fd07f; --hero:linear-gradient(135deg,#ff9a3c 0%,#f2604f 50%,#c2407e 100%);
  --b1:#ff7a2f; --b2:#b8407e; --b3:#ffb03a; --b4:#5a4fcf; --blob-op:.32; --shadow:0 10px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

/* ---------- живой фон ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;width:75vmax;height:75vmax;border-radius:50%;opacity:var(--blob-op);
  background:radial-gradient(circle at center,var(--c) 0%,transparent 60%);will-change:transform}
.blob.a{--c:var(--b1);top:-35vmax;right:-30vmax;animation:drift1 26s ease-in-out infinite alternate}
.blob.b{--c:var(--b2);top:30vh;left:-40vmax;animation:drift2 32s ease-in-out infinite alternate}
.blob.c{--c:var(--b3);bottom:-40vmax;right:-25vmax;animation:drift3 28s ease-in-out infinite alternate}
.blob.d{--c:var(--b4);top:10vh;left:20vw;width:45vmax;height:45vmax;opacity:calc(var(--blob-op)*.6);animation:drift2 38s ease-in-out infinite alternate-reverse}
.sun{position:absolute;top:calc(env(safe-area-inset-top) - 60px);right:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,102,.9) 0%,rgba(255,170,60,.35) 38%,transparent 70%);animation:pulse 7s ease-in-out infinite}
.sun::after{content:"";position:absolute;inset:-40px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,90,.16) 0deg 6deg,transparent 6deg 24deg);
  -webkit-mask:radial-gradient(circle,transparent 30%,#000 45%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 45%,transparent 70%);
  animation:spin 60s linear infinite}
@keyframes drift1{to{transform:translate(-18vmax,22vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(28vmax,-12vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(-22vmax,-18vmax) scale(1.1)}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 8px) 0 8px;
  background:linear-gradient(var(--bg) 45%,transparent)}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mgrp{display:flex;align-items:center;gap:6px;min-width:0}
.mbar h1{font-size:20px;margin:0 4px;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.mbar h1::first-letter{text-transform:uppercase}
.mnav{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--ink2);
  background:var(--card);border:1px solid var(--ring);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.mnav:active{transform:scale(.9)}
.mnav[disabled]{opacity:.35}
.mnav.gear{font-size:19px}
.mnav.gear.on{background:var(--accent-soft)}
.hello{font-size:15px;color:var(--ink2);margin:2px 4px 12px;display:flex;justify-content:space-between;gap:8px}

/* ---------- карточки ---------- */
.card{background:var(--card);border-radius:22px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow);
  border:1px solid var(--ring);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.card h2{font-size:15px;margin:0 0 12px;color:var(--ink2);font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px}
.enter .card{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.muted{color:var(--muted)} .sec{color:var(--ink2)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}

.hero .label{font-size:14px;color:var(--ink2)}
.hero .total{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px}
.hero .delta{font-size:14px;color:var(--ink2)}
.hero .split{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--ink2)}
.hero .split b{color:var(--ink)}
.sunny{background:var(--hero);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(255,110,60,.35)}
.sunny.bad{background:var(--hero-bad);box-shadow:0 14px 34px rgba(229,72,77,.35)}
.sunny::before{content:"";position:absolute;top:-60%;left:-30%;width:80%;height:200%;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transform:translateX(-120%) rotate(8deg);animation:shine 6s ease-in-out 1.2s infinite}
@keyframes shine{0%,60%{transform:translateX(-120%) rotate(8deg)}100%{transform:translateX(260%) rotate(8deg)}}
.sunny .label,.sunny .delta,.sunny .budget-row{color:rgba(255,255,255,.92)}
.sunny .total{font-size:46px;text-shadow:0 2px 12px rgba(120,30,0,.18)}
.sunny .progress{background:rgba(255,255,255,.28)}
.sunny .progress>i{background:#fff}
.sunny details.calc{color:rgba(255,255,255,.92)} .sunny details.calc summary{color:#fff;font-weight:600}
.sunny .calc tr.tot td{border-color:rgba(255,255,255,.35);color:#fff}
.sunny b{color:#fff}
.piggy{margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.18);font-size:12.5px;line-height:1.35;color:rgba(255,255,255,.95);display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%}
.piggy u{text-decoration:none;font-weight:700}
.progress{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:14px 0 8px}
.progress>i{display:block;height:100%;border-radius:5px;background:var(--accent);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.progress.warn>i{background:var(--warn)} .progress.bad>i{background:var(--bad)}
.budget-row{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);gap:8px;flex-wrap:wrap}
details.calc{margin-top:12px;font-size:14px;color:var(--ink2)}
details.calc summary{cursor:pointer;color:var(--accent);list-style:none}
details.calc summary::-webkit-details-marker{display:none}
.calc table{width:100%;border-collapse:collapse;margin-top:8px}
.calc td{padding:4px 0}
.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.calc tr.tot td{border-top:1px solid var(--line);font-weight:650;color:var(--ink);padding-top:8px}

.tips{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tips li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.tips .ic{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--line)}
.tips .good .ic{background:color-mix(in srgb,var(--good) 20%,transparent)}
.tips .warn .ic{background:color-mix(in srgb,var(--warn) 28%,transparent)}
.tips .bad .ic{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.tips .info .ic{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.tips b{font-weight:650}

.grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 6px 4px;font-weight:650}
.grp:first-child{margin-top:0}
.cats{display:grid;gap:2px}
.crow{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;
  padding:8px 6px;border-radius:14px;text-align:left;width:100%;transition:background .15s,transform .15s}
.crow:active{transform:scale(.98);background:var(--ring)}
@media (hover:hover){.crow:hover{background:var(--ring)}}
.crow .em{font-size:20px;grid-row:span 2;text-align:center}
.crow .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .am{font-size:15px;font-weight:650;text-align:right}
.crow .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.crow .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff5480);border-radius:4px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.crow .pc{font-size:12px;color:var(--muted);text-align:right;min-width:36px}

.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.prow.first{border-top:0}
.prow .em{font-size:22px;width:30px;text-align:center;flex:none}
.prow .tx{flex:1;min-width:0}
.prow .d1{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .d2{font-size:13px;color:var(--muted)}
.prow .am{font-weight:650;white-space:nowrap;text-align:right}
.prow.paid .d1,.prow.paid .am{color:var(--muted)}
.ptotal{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;margin:-2px 0 6px;border-radius:14px;background:var(--card-solid);border:1px solid var(--ring);font-size:14px;color:var(--ink2)}
.ptotal b{color:var(--ink)}
.pay-btn{padding:7px 12px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:650;margin-top:4px;
  transition:transform .12s;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.pay-btn:active{transform:scale(.92)}
.ok{font-size:13px;color:var(--good-ink)}
.late{color:var(--bad)!important}
.soon{color:var(--accent-strong)!important}
.mini-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.mini-bar>i{display:block;height:100%;background:linear-gradient(90deg,#1fa65a,#7bd88f);border-radius:3px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3>div{background:var(--card-solid);border-radius:16px;padding:10px;border:1px solid var(--ring);min-width:0}
.stat3 .v{font-size:16px;font-weight:750;margin-top:2px;letter-spacing:-.01em;white-space:nowrap}
.stat3 .k{font-size:12px;color:var(--muted)}
.loan-in{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--ink2)}
.loan-in .inp{padding:8px 10px;max-width:150px}

.chart-tip{font-size:14px;color:var(--ink2);min-height:20px;margin:-4px 0 6px}
.chart-tip b{color:var(--ink)}
svg.daily{width:100%;height:auto;display:block;touch-action:pan-y}
svg.daily .b{fill:url(#barg)}
svg.daily .b.sel{fill:var(--accent-strong)}
svg.daily .hit{fill:transparent;cursor:pointer}
svg.daily .ax{stroke:var(--base);stroke-width:1}
svg.daily .grid{stroke:var(--line);stroke-width:1}
svg.daily text{fill:var(--muted);font-size:9px;font-family:inherit}

.search{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--ring);
  background:var(--card);margin-bottom:10px;outline:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.search:focus{border-color:var(--accent)}
.filter-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:var(--accent-soft);color:var(--ink);font-size:14px;margin-bottom:10px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:16px 4px 6px}
.day-h:first-child{margin-top:4px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line);border-radius:10px;transition:background .15s}
.item:active{background:var(--ring)}
.item .em{font-size:22px;width:30px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .d1{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d2{font-size:13px;color:var(--muted)}
.item .am{font-weight:650;white-space:nowrap}
.item .am.inc{color:var(--good-ink)}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
.empty .big{font-size:44px;margin-bottom:8px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ring);background:var(--card-solid);outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
select.inp{appearance:none;-webkit-appearance:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;
  background:var(--card-solid);border:1px solid var(--ring);font-weight:650;font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#ff9a3c,#ff6a4d);color:var(--on-accent);border:0;box-shadow:0 6px 16px rgba(255,110,60,.32)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:0;color:var(--accent-strong);padding:8px 0;box-shadow:none}
.btn.sm{padding:8px 12px;font-size:14px}
.btns{display:grid;gap:8px}
.btns.two{grid-template-columns:1fr 1fr}
.srow{display:grid;grid-template-columns:1fr 92px 54px 28px;gap:6px;margin-bottom:8px;align-items:center}
.srow .inp{padding:10px}
.srow .full{grid-column:1 / 4}
.srow:has(.full){padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.srow .x,.cat-edit .x{color:var(--muted);font-size:18px;height:40px}
.shead{display:grid;grid-template-columns:1fr 92px 54px 28px;gap:6px;font-size:12px;color:var(--muted);margin:0 2px 4px}
.cat-edit{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cat-edit:first-child{border-top:0}
.cat-edit .em{font-size:20px;width:28px;text-align:center}
.cat-edit .nm{flex:1}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--ink2);white-space:nowrap}
.badge.fixed{background:var(--accent-soft);color:var(--ink)}
.badge.out{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good-ink)}
.badge.in{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.addcat{display:flex;gap:8px;margin-top:10px}
.addcat .e{width:56px;text-align:center}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--warn) 18%,var(--card-solid))}
.banner .btn{padding:8px 12px}
.howto ol{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:15px}
.howto li{margin:4px 0}
label.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2);margin:4px 2px 14px}
label.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.advice{margin-top:12px;padding:12px;border-radius:16px;background:var(--card-solid);border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);font-size:14px;color:var(--ink2)}
.advice table{width:100%;border-collapse:collapse;margin:6px 0 8px}
.advice td{padding:3px 0}.advice td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.advice tr.tot td{border-top:1px solid var(--line);font-weight:650;color:var(--ink);padding-top:6px}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- нижняя панель ---------- */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:10;
  background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--ring);border-radius:24px;padding:6px;box-shadow:var(--shadow);max-width:540px;margin:0 auto}
nav.tabs .in{display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:16px;transition:color .2s}
.tab .i{font-size:21px;line-height:1;filter:grayscale(1);opacity:.65;transition:transform .25s cubic-bezier(.3,1.6,.5,1),filter .2s,opacity .2s}
.tab.on{color:var(--accent-strong)} .tab.on .i{filter:none;opacity:1;transform:translateY(-2px) scale(1.15)}
.fab{width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg,#ffb03a,#ff6a4d 60%,#ff4f8b);color:#fff;
  font-size:34px;line-height:1;display:grid;place-items:center;margin:-26px auto 0;font-weight:300;
  box-shadow:0 10px 24px rgba(255,100,60,.45);transition:transform .2s cubic-bezier(.3,1.6,.5,1);animation:fabglow 3.5s ease-in-out infinite}
.fab:active{transform:scale(.88) rotate(90deg)}
@keyframes fabglow{50%{box-shadow:0 10px 30px rgba(255,100,60,.65)}}

/* ---------- шторки ---------- */
.scrim{position:fixed;inset:0;background:rgba(40,15,0,.32);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card-solid);border-radius:26px 26px 0 0;
  max-width:560px;margin:0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-h h3{margin:0;font-size:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:3px;margin-bottom:10px;border:1px solid var(--ring);position:relative}
.seg button{padding:9px;border-radius:11px;font-weight:650;color:var(--ink2);font-size:15px;position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:11px;background:var(--card-solid);
  box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.seg.r::before{transform:translateX(100%)}
.amount-in{width:100%;font-size:42px;font-weight:800;border:0;background:transparent;outline:none;padding:4px 0;letter-spacing:-.03em}
.amount-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin-bottom:12px;transition:border-color .2s}
.amount-wrap:focus-within{border-color:var(--accent)}
.amount-wrap span{font-size:28px;color:var(--muted);font-weight:650;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chips .grp{width:100%;margin:6px 2px 0}
.chip{padding:8px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--ring);font-size:14px;white-space:nowrap;transition:transform .15s,background .2s}
.chip:active{transform:scale(.92)}
.chip.on{background:linear-gradient(135deg,#ff9a3c,#ff6a4d);color:#fff;border-color:transparent;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.chip .auto{font-size:10px;opacity:.9;margin-left:4px;text-transform:uppercase;letter-spacing:.04em}
.recent{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent .chip{flex:none}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.row2.eq{grid-template-columns:1fr 1fr}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.flabel{font-size:13px;color:var(--muted);margin:0 2px 4px}
.guess{font-size:14px;color:var(--ink2);margin:8px 2px 0;min-height:20px}
.guess b{display:inline-block;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px) scale(.9);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14px;opacity:0;font-weight:550;
  transition:all .35s cubic-bezier(.3,1.5,.5,1);z-index:30;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%)}
.conf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:40;pointer-events:none}
.haptic{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<script src="categories.js"></script>
<script>
'use strict';
/* ---------- константы ---------- */
const M_NOM=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const M_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const M_PREP=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const M_DAT=['январю','февралю','марту','апрелю','маю','июню','июлю','августу','сентябрю','октябрю','ноябрю','декабрю'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const DAY=864e5;
const DEBT_CATS=new Set(['loans','mortgage','installments']);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey=d=>ymd(d).slice(0,7);
const todayStr=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const shiftMonth=(k,n)=>{const [y,m]=k.split('-').map(Number);return mkey(new Date(y,m-1+n,1))};
const daysIn=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const dateOnDay=(y,m,day)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
const mIdx=k=>Number(k.slice(5,7))-1;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const money=n=>nf.format(Math.round(n))+' ₽';
const pct=(a,b)=>b?Math.round(a/b*100):0;
const r500=x=>Math.max(0,Math.floor(x/500)*500);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е').replace(/э/g,'е').replace(/[^a-zа-я0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const sum=a=>a.reduce((s,e)=>s+(+e.amount||0),0);
const fmtD=d=>`${d.getDate()} ${M_GEN[d.getMonth()]}`;
const fmtDs=ds=>fmtD(parseD(ds));
function plural(n,[one,few,many]){n=Math.abs(n)%100;const n1=n%10;
  if(n>10&&n<20)return many; if(n1>1&&n1<5)return few; if(n1===1)return one; return many;}
const days=n=>`${n} ${plural(n,['день','дня','дней'])}`;
const daysUntil=ds=>Math.round((parseD(ds)-sod(new Date()))/DAY);
function dueText(ds){const n=daysUntil(ds);
  if(n<0)return {t:`просрочено на ${days(-n)}`,c:'late'};
  if(n===0)return {t:'сегодня срок',c:'soon'}; if(n===1)return {t:'завтра срок',c:'soon'};
  return {t:`до ${fmtDs(ds)} · через ${days(n)}`,c:n<=3?'soon':''};}
function parseAmount(s){
  const parts=String(s||'').replace(/\s/g,'').replace(/,/g,'.').split('+').filter(Boolean);
  let t=0; for(const p of parts){const v=parseFloat(p); if(!isFinite(v))return NaN; t+=v;}
  return Math.round(t*100)/100;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2400)}

/* ---------- тактильный отклик и эффекты ---------- */
// Android — вибрация; iPhone (iOS 18+) — скрытый переключатель «switch» даёт системный тик.
function haptic(kind='light'){
  try{
    if(navigator.vibrate){navigator.vibrate(kind==='success'?[10,50,16]:kind==='warn'?[20,40,20]:8);return}
    const l=$('#hapticL'); l.click(); if(kind!=='light')setTimeout(()=>l.click(),110);
  }catch(e){}
}
function confetti(x,y){
  if(REDUCED)return;
  const colors=['#ffb03a','#ff6a4d','#ff4f8b','#ffd86b','#7bd88f','#8fd3ff'];
  for(let i=0;i<34;i++){
    const s=document.createElement('i');s.className='conf';s.style.background=colors[i%colors.length];
    s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);
    const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3, v=90+Math.random()*150;
    s.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v}px) rotate(${Math.random()*540}deg)`,opacity:1,offset:.55},
      {transform:`translate(${Math.cos(a)*v*1.2}px,${Math.sin(a)*v+160}px) rotate(${Math.random()*900}deg)`,opacity:0}],
      {duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>s.remove();
  }
}
const confettiAt=el=>{const r=el?.getBoundingClientRect?.();confetti(r?r.left+r.width/2:innerWidth/2,r?r.top+r.height/2:innerHeight/2)};
const shown={}; // плавно «докручиваем» большие цифры
function countUp(el,key,to){
  if(!el)return; const from=shown[key]??to; shown[key]=to;
  if(REDUCED||from===to){el.textContent=money(to);return}
  const t0=performance.now(),dur=700;
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=money(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

/* ---------- хранилище: IndexedDB + копия в localStorage ---------- */
const LS_KEY='rashody-state';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('rashody',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadState(){
  let st=null;
  try{const db=await idb();st=await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('state');
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){}
  if(!st){try{st=JSON.parse(localStorage.getItem(LS_KEY))}catch(e){}}
  return st;
}
let saveTimer;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,150)}
async function saveNow(){
  const snap=JSON.parse(JSON.stringify(S));
  try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');
    t.objectStore('kv').put(snap,'state');t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}
  try{localStorage.setItem(LS_KEY,JSON.stringify(snap))}catch(e){}
}
let persisted=null;
async function askPersist(){
  try{ if(navigator.storage?.persisted){persisted=await navigator.storage.persisted();
    if(!persisted&&navigator.storage.persist)persisted=await navigator.storage.persist();} }catch(e){}
}
const defaultCats=()=>DEFAULT_CATS.map(({kw,...c})=>({...c}));
function freshState(){return {v:3,expenses:[],extra:[],incomes:[],planned:[],debts:[],saveMonthly:0,categories:defaultCats(),budget:0,learned:{},lastBackup:0,created:Date.now()}}
// Две строки под аванс и зарплату всегда на месте (пустые не участвуют в расчёте)
function ensureIncomeSlots(st){
  if(st.incomes.length>=2)return;
  if(!st.incomes.length)st.incomes.push({id:uid(),name:'Аванс',amount:0,day:25},{id:uid(),name:'Зарплата',amount:0,day:10});
  else{const d=st.incomes[0].day;st.incomes.push(d===10?{id:uid(),name:'Аванс',amount:0,day:25}:{id:uid(),name:'Зарплата',amount:0,day:d===25?10:(d<=15?d+15:d-15)})}
}
function migrate(st){
  if(!st)st=freshState();
  st.expenses||=[];st.extra||=[];st.incomes||=[];st.planned||=[];st.debts||=[];st.learned||={};st.budget??=0;
  if((st.v||1)<2){
    const OLD=['food','cafe','transport','home','subs','health','sport','beauty','shop','fun','gifts','other'];
    const custom=(st.categories||[]).filter(c=>!OLD.includes(c.id)).map(c=>({...c,kind:'var'}));
    st.categories=defaultCats(); const oi=st.categories.findIndex(c=>c.id==='other');
    st.categories.splice(oi,0,...custom);
    const prev=S; S=st; // guess() работает с глобальным S
    for(const k in st.learned)if(['home','subs','other'].includes(st.learned[k])||!catExists(st.learned[k]))delete st.learned[k];
    for(const e of st.expenses)if(['home','subs','other'].includes(e.cat)||!catExists(e.cat))e.cat=guess(e.desc)||'other';
    S=prev;
  }
  // копилка была в процентах — переводим в рубли в месяц
  if(st.saveMonthly==null){st.saveMonthly=st.savePct>0?Math.round(sum(st.incomes)*st.savePct/100):0}
  delete st.savePct;
  st.v=3;
  if(!st.categories.some(c=>c.id==='other'))st.categories.push({id:'other',name:'Другое',emoji:'📦',kind:'var'});
  for(const c of st.categories)c.kind||='var';
  ensureIncomeSlots(st);
  return st;
}

/* ---------- авто-категории ---------- */
// «~слово» — слабое (общие слова вроде «заказ»), «=слово» — только целиком.
let KWC=[];
function compileKW(){
  KWC=[];
  for(const c of DEFAULT_CATS)for(let raw of c.kw){
    let weak=false,exact=false;
    if(raw[0]==='~'){weak=true;raw=raw.slice(1)}
    if(raw[0]==='='){exact=true;raw=raw.slice(1)}
    const k=norm(raw); if(!k)continue;
    KWC.push({cat:c.id,words:k.split(' '),score:weak?k.length*.4:k.length,exact});
  }
}
const wordHit=(t,w,exact)=>exact||w.length<=3?t===w:t.startsWith(w);
function dictGuess(n){
  if(!n)return null; const toks=n.split(' '); let best=null,sc=0;
  for(const k of KWC){
    if(k.score<=sc||!catExists(k.cat))continue;
    const L=k.words.length; let hit=false;
    if(L===1)hit=toks.some(t=>wordHit(t,k.words[0],k.exact));
    else for(let i=0;i+L<=toks.length&&!hit;i++)hit=k.words.every((w,j)=>w.length<=2?toks[i+j]===w:toks[i+j].startsWith(w));
    if(hit){best=k.cat;sc=k.score}
  }
  if(!best){ // слово ещё дописывается: «бутер» → «бутерброд»
    const last=toks[toks.length-1];
    if(last&&last.length>=4)for(const k of KWC)
      if(k.words.length===1&&k.words[0].length>last.length&&k.words[0].startsWith(last)&&catExists(k.cat)){best=k.cat;break}
  }
  return best;
}
const catExists=id=>!!id&&S.categories.some(c=>c.id===id);
function guess(desc){
  const n=norm(desc); if(!n)return null; const L=S.learned||{};
  if(catExists(L[n]))return L[n];
  for(const t of n.split(' '))if(catExists(L['w:'+t]))return L['w:'+t];
  return dictGuess(n)||'other';
}
const cat=id=>S.categories.find(c=>c.id===id)||S.categories.find(c=>c.id==='other')||{id:'other',name:'Другое',emoji:'📦',kind:'var'};
const isFixed=id=>cat(id).kind==='fixed';

/* ---------- состояние интерфейса ---------- */
let S;
const ui={month:mkey(new Date()),view:'home',lastView:null,catFilter:null,search:'',editId:null,fType:'exp',fCat:null,fManual:false,fGuess:null,selDay:null,dEdit:null,dDir:'out'};
const inMonth=k=>S.expenses.filter(e=>e.date.startsWith(k));
const isCurMonth=k=>k===mkey(new Date());
const monthlyIncome=()=>sum(S.incomes.filter(i=>i.amount>0&&i.day>=1));

/* ---------- кредиты и долги ---------- */
function occurrences(day,ref,from=-2,to=2){const r=[];for(let dm=from;dm<=to;dm++)r.push(dateOnDay(ref.getFullYear(),ref.getMonth()+dm,day));return r}
function linkedPayment(p,due){ // оплачен ли обязательный платёж за эту дату
  const from=ymd(new Date(due-25*DAY)), to=ymd(new Date(+due+25*DAY));
  return S.expenses.find(x=>x.plannedId===p.id&&x.date>=from&&x.date<=to&&(!x.forDue||x.forDue===ymd(due)));
}
// Остаток по кредиту: «сколько осталось» на момент ввода минус платежи после этого
function loanInfo(p){
  if(!(p.total>0))return null;
  const paid=sum(S.expenses.filter(x=>x.plannedId===p.id&&(x.ts||0)>(p.totalTs||0)));
  const left=Math.max(0,p.total-paid), n=p.amount>0?Math.ceil(left/p.amount-1e-9):0;
  const t=sod(new Date());
  const nextDue=occurrences(p.day,t,-1,2).find(d=>!linkedPayment(p,d)&&d>=new Date(t-20*DAY))||t;
  const last=n>0?dateOnDay(nextDue.getFullYear(),nextDue.getMonth()+n-1,p.day):null;
  return {paid,left,n,last,done:left<=0,share:p.total?paid/p.total:0};
}
const activePlanned=()=>S.planned.filter(p=>p.amount>0&&!loanInfo(p)?.done);
const debtLeft=d=>Math.max(0,d.amount-sum(d.returns||[]));
const openDebts=dir=>S.debts.filter(d=>(!dir||d.dir===dir)&&debtLeft(d)>0);

/* ---------- копилка: сколько можно откладывать ---------- */
function saveAdvice(){
  const inc=monthlyIncome(); if(!inc)return null;
  const fixed=activePlanned().reduce((s,p)=>s+p.amount,0);
  // повседневные траты в месяц: по последним 60 дням (не меньше 7 дней наблюдений)
  const since=ymd(new Date(Date.now()-60*DAY)), T=todayStr();
  const v=S.expenses.filter(e=>!e.debtId&&!e.plannedId&&!isFixed(e.cat)&&e.date>=since&&e.date<=T);
  let varM=null,span=0;
  if(v.length){const first=v.reduce((m,e)=>e.date<m?e.date:m,T);span=Math.round((sod(new Date())-parseD(first))/DAY)+1;
    varM=sum(v)/Math.max(span,7)*30.4}
  const free=inc-fixed-(varM||0);
  const rec=varM==null?r500(inc*.1):r500(free*.7);
  return {inc,fixed,varM,span,free,rec,p10:r500(inc*.1),p20:r500(inc*.2)};
}

/* ---------- период до зарплаты ---------- */
function period(now=new Date()){
  const inc=S.incomes.filter(i=>i.amount>0&&i.day>=1&&i.day<=31); if(!inc.length)return null;
  const t=sod(now), T=ymd(t), pts=[];
  for(const i of inc)for(const d of occurrences(i.day,t))pts.push({d,i});
  pts.sort((a,b)=>a.d-b.d);
  let start=null,next=null; for(const p of pts){if(p.d<=t)start=p.d;else if(!next)next=p.d}
  const S0=ymd(start), N0=ymd(next);
  const income=pts.filter(p=>+p.d===+start).reduce((s,p)=>s+p.i.amount,0);
  const startNames=pts.filter(p=>+p.d===+start).map(p=>p.i.name||'Доход');
  const nextNames=pts.filter(p=>+p.d===+next).map(p=>p.i.name||'Доход');
  const inP=ds=>ds>=S0&&ds<N0&&ds<=T;
  const exps=S.expenses.filter(x=>inP(x.date));
  const extra=S.extra.filter(x=>inP(x.date));
  const due=[];
  for(const p of S.planned){ if(!(p.amount>0)||!(p.day>=1))continue;
    const li=loanInfo(p); if(li&&li.done)continue; // кредит закрыт — больше не резервируем
    for(const d of occurrences(p.day,start,-1,1))if(d>=start&&d<next)due.push({p,d,paid:linkedPayment(p,d)}); }
  due.sort((a,b)=>a.d-b.d);
  const owe=openDebts('in').filter(d=>d.due&&d.due<N0).map(d=>({d,left:debtLeft(d)}));
  const oweSum=owe.reduce((s,x)=>s+x.left,0);
  const mi=monthlyIncome();
  // копилка делится между выплатами пропорционально их размеру
  const saveAmt=mi?Math.round((+S.saveMonthly||0)*income/mi):0;
  const spent=sum(exps), extraSum=sum(extra);
  const reserve=due.filter(x=>!x.paid).reduce((s,x)=>s+x.p.amount,0);
  const free=income+extraSum-saveAmt-spent-reserve-oweSum;
  const daysLeft=Math.max(1,Math.round((next-t)/DAY));
  const spentToday=sum(exps.filter(x=>x.date===T&&!x.plannedId&&!x.debtId));
  const limit=(free+spentToday)/daysLeft;
  const limitFor=save=>(free+saveAmt-save+spentToday)/daysLeft; // лимит при другой сумме копилки за эту выплату
  return {start,next,income,startNames,nextNames,exps,extraSum,due,owe,oweSum,spent,saveAmt,reserve,free,daysLeft,spentToday,limit,limitFor,todayLeft:limit-spentToday};
}
function autoLink(e){ // привязать трату к обязательному платежу той же категории
  if(e.plannedId||e.debtId||!isFixed(e.cat))return;
  const ed=parseD(e.date); let best=null,bd=Infinity;
  for(const p of S.planned){ if(p.cat!==e.cat)continue;
    for(const d of occurrences(p.day,ed,-1,1)){ if(Math.abs(d-ed)>25*DAY||linkedPayment(p,d))continue;
      const diff=Math.abs(p.amount-e.amount)+Math.abs(d-ed)/DAY; if(diff<bd){bd=diff;best={p,d}} } }
  if(best){e.plannedId=best.p.id;e.forDue=ymd(best.d)}
}

/* ---------- советы ---------- */
function groupBy(exps){const r={};for(const e of exps)r[e.cat]=(r[e.cat]||0)+e.amount;return r}
function insights(k){
  const out=[]; const exps=inMonth(k).filter(e=>!e.debtId); const total=sum(exps);
  const cur=isCurMonth(k); const N=daysIn(k); const d=cur?new Date().getDate():N;
  const prevK=shiftMonth(k,-1); const prevAll=inMonth(prevK).filter(e=>!e.debtId);
  const prevCmp=cur?prevAll.filter(e=>Number(e.date.slice(8))<=d):prevAll;
  const prevTotal=sum(prevCmp); const P=cur?period():null;
  const mi=monthlyIncome();
  if(P){
    if(P.free<0)out.push({t:'bad',i:'⛔',x:`До зарплаты не хватает <b>${money(-P.free)}</b> с учётом обязательных платежей${P.saveAmt?' и копилки':''}. Сейчас лучше только самое необходимое${P.saveAmt?' — или временно уменьши сумму в копилку':''}.`});
    else if(P.todayLeft<0)out.push({t:'warn',i:'⚠️',x:`Сегодня ты вышел за дневной лимит на <b>${money(-P.todayLeft)}</b>. Не страшно: завтра лимит пересчитается и станет ~${money(P.free/Math.max(1,P.daysLeft-1))}.`});
    else if(P.limit>0)out.push({t:'good',i:'☀️',x:`До зарплаты ${days(P.daysLeft)}, можно тратить до <b>${money(P.limit)}</b> в день. Что не потратишь сегодня — добавится к следующим дням.`});
  }else if(cur&&!mi){
    out.push({t:'info',i:'💼',x:'Укажи аванс и зарплату в настройках ⚙️ — посчитаю, сколько можно тратить в день до следующей выплаты.'});
  }
  // долги людей
  for(const dbt of openDebts('out'))if(dbt.due&&daysUntil(dbt.due)<0)
    out.push({t:'warn',i:'🤝',x:`${esc(dbt.who)} должен вернуть <b>${money(debtLeft(dbt))}</b> — срок прошёл ${fmtDs(dbt.due)}. Самое время напомнить 😉`});
  for(const dbt of openDebts('in'))if(dbt.due&&daysUntil(dbt.due)<=3)
    out.push({t:daysUntil(dbt.due)<0?'bad':'warn',i:'⏰',x:`Вернуть <b>${money(debtLeft(dbt))}</b> — ${esc(dbt.who)}, ${daysUntil(dbt.due)<0?'срок уже прошёл':'срок '+fmtDs(dbt.due)}.`});
  if(mi>0){
    const debt=activePlanned().filter(p=>DEBT_CATS.has(p.cat)).reduce((s,p)=>s+p.amount,0), r=debt/mi;
    if(r>.4)out.push({t:'bad',i:'🏦',x:`Кредиты, ипотека и рассрочки забирают <b>${Math.round(r*100)}% дохода</b>. Безопасно — до 30–40%. Не бери новые рассрочки и гаси в первую очередь долг с самой высокой ставкой.`});
    else if(r>.3)out.push({t:'warn',i:'🏦',x:`На кредиты и рассрочки уходит <b>${Math.round(r*100)}% дохода</b> — близко к верхней границе (30–40%). Новые сплиты лучше не оформлять.`});
    const splits=activePlanned().filter(p=>p.cat==='installments').length;
    if(splits>=3)out.push({t:'warn',i:'🧾',x:`У тебя ${splits} ${plural(splits,['рассрочка','рассрочки','рассрочек'])}. Мелкие «сплиты» легко копятся и незаметно съедают зарплату.`});
    for(const p of S.planned){const li=loanInfo(p);if(li&&!li.done&&li.n<=2)
      out.push({t:'good',i:'🎉',x:`${esc(p.name||cat(p.cat).name)}: ${li.n===1?'остался последний платёж':'осталось всего 2 платежа'}! Потом в месяц освободится ${money(p.amount)}.`});}
    const A=saveAdvice();
    if(!(+S.saveMonthly>0)&&A&&A.rec>0)out.push({t:'info',i:'🐷',x:`По твоим тратам можно спокойно откладывать <b>~${money(A.rec)} в месяц</b>. Включи копилку в настройках ⚙️ — сразу учту её в дневном лимите.`});
    else if(+S.saveMonthly>0&&A&&A.varM!=null&&A.free<S.saveMonthly)out.push({t:'warn',i:'🐷',x:`Копилка ${money(S.saveMonthly)}/мес больше, чем реально остаётся (~${money(Math.max(0,A.free))}). Возможно, стоит уменьшить её до ~${money(A.rec)}.`});
  }
  if(!exps.length){
    out.push({t:'info',i:'✍️',x:'Пока нет трат за этот месяц. Нажми <b>+</b>, впиши сумму и на что потратил — категорию подберу сам.'});
    return out;
  }
  const varExps=exps.filter(e=>!isFixed(e.cat)), varTotal=sum(varExps);
  if(!mi&&S.budget>0){
    if(total>S.budget)out.push({t:'bad',i:'⛔',x:`Месячный лимит превышен на <b>${money(total-S.budget)}</b>.`});
    else if(cur){
      const fixed=total-varTotal, forecast=fixed+varTotal/d*N, perDay=(S.budget-total)/(N-d+1);
      if(forecast>S.budget*1.05)out.push({t:'warn',i:'⚠️',x:`При таком темпе к концу месяца выйдет ~<b>${money(forecast)}</b>. Чтобы уложиться, трать не больше <b>${money(perDay)}</b> в день.`});
      else out.push({t:'good',i:'✅',x:`Идёшь в рамках лимита: прогноз ~${money(forecast)}, можно до <b>${money(perDay)}</b> в день.`});
    }
  }
  if(prevTotal>0){
    const byCur=groupBy(varExps), byPrev=groupBy(prevCmp.filter(e=>!isFixed(e.cat))); let worst=null;
    for(const [c,v] of Object.entries(byCur)){const p=byPrev[c]||0,diff=v-p;
      if(p>0&&v>p*1.3&&diff>Math.max(500,varTotal*.05)&&(!worst||diff>worst.diff))worst={c,v,p,diff};}
    const per=cur?' за то же время':'';
    if(worst)out.push({t:'warn',i:'📈',x:`${cat(worst.c).emoji} <b>${esc(cat(worst.c).name)}</b>: ${money(worst.v)} — на ${pct(worst.diff,worst.p)}% больше, чем${per} в ${M_PREP[mIdx(prevK)]}.`});
    const prevVar=sum(prevCmp.filter(e=>!isFixed(e.cat)));
    if(prevVar>0&&varTotal/prevVar-1<=-.1)out.push({t:'good',i:'👍',x:`На повседневное тратишь на <b>${Math.round((1-varTotal/prevVar)*100)}% меньше</b>, чем${per} в ${M_PREP[mIdx(prevK)]}. Так держать!`});
  }
  const small=varExps.filter(e=>e.amount<=500);
  if(small.length>=10){const s=sum(small);
    out.push({t:'info',i:'☕',x:`${small.length} ${plural(small.length,['мелкая покупка','мелкие покупки','мелких покупок'])} до 500 ₽ на <b>${money(s)}</b>. Мелочи складываются: за год это ~${money(s/d*365)}.`});}
  const cafe=sum(exps.filter(e=>e.cat==='cafe')), food=sum(exps.filter(e=>e.cat==='food'));
  if(cafe>3000&&food>0&&cafe>food*.8)out.push({t:'info',i:'🥐',x:`На кафе и перекусы (${money(cafe)}) уходит почти как на продукты (${money(food)}). Еда из дома в 3–4 раза дешевле.`});
  const top=Object.entries(groupBy(varExps)).sort((a,b)=>b[1]-a[1])[0];
  if(top&&varTotal>0&&top[1]/varTotal>=.35&&varExps.length>=5)
    out.push({t:'info',i:'🔎',x:`${pct(top[1],varTotal)}% повседневных трат — ${cat(top[0]).emoji} <b>${esc(cat(top[0]).name)}</b>. Если хочешь сэкономить, начни отсюда.`});
  const subs=exps.filter(e=>e.cat==='subs');
  if(subs.length>=3)out.push({t:'info',i:'🔁',x:`На подписки ушло <b>${money(sum(subs))}</b> (${subs.length} ${plural(subs.length,['платёж','платежа','платежей'])}). Проверь, всеми ли пользуешься.`});
  const byDay={};for(const e of varExps)byDay[e.date]=(byDay[e.date]||0)+e.amount;
  let we=[],wd=[];for(const [ds,v] of Object.entries(byDay)){const w=parseD(ds).getDay();(w===0||w===6?we:wd).push(v)}
  if(we.length>=2&&wd.length>=4){const a=we.reduce((s,v)=>s+v,0)/we.length,b=wd.reduce((s,v)=>s+v,0)/wd.length;
    if(a>b*1.6)out.push({t:'info',i:'📅',x:`В выходные тратишь в <b>${(a/b).toFixed(1).replace('.',',')} раза больше</b>, чем в будни (${money(a)} против ${money(b)} в день).`});}
  const big=[...varExps].sort((a,b)=>b.amount-a.amount)[0];
  if(big&&varTotal>0&&big.amount/varTotal>=.15)
    out.push({t:'info',i:'💸',x:`Самая крупная трата — «${esc(big.desc||cat(big.cat).name)}» на <b>${money(big.amount)}</b> (${pct(big.amount,varTotal)}% повседневных).`});
  const oth=sum(exps.filter(e=>e.cat==='other'));
  if(oth/total>.15&&oth>1000)out.push({t:'info',i:'🏷️',x:`${pct(oth,total)}% трат лежит в «Другом». Поправь им категории — я запомню, и всё станет точнее.`});
  return out;
}

function dailyChart(k){
  const N=daysIn(k), vals=Array(N).fill(0);
  for(const e of inMonth(k))if(!isFixed(e.cat)&&!e.debtId)vals[Number(e.date.slice(8))-1]+=e.amount;
  const W=320,H=130,top=8,bot=18,ch=H-top-bot,slot=W/N,bw=Math.max(2,slot-2),mx=Math.max(...vals,1);
  const cur=isCurMonth(k), today=new Date().getDate();
  let s=`<svg class="daily" viewBox="0 0 ${W} ${H}" role="img" aria-label="Повседневные расходы по дням">
    <defs><linearGradient id="barg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a4d"/><stop offset="1" stop-color="#ffb03a"/></linearGradient></defs>`;
  s+=`<line class="grid" x1="0" x2="${W}" y1="${top}" y2="${top}"/><text x="${W}" y="${top-1}" text-anchor="end" style="font-size:8px">${money(mx)}</text>`;
  const P=cur?period():null;
  if(P&&P.limit>0&&P.limit<mx){const ly=top+ch-P.limit/mx*ch;
    s+=`<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><text x="2" y="${ly-2}" style="font-size:8px">лимит</text>`;}
  vals.forEach((v,i)=>{
    const x=i*slot+(slot-bw)/2;
    if(v>0){const h=Math.max(2,v/mx*ch),y=top+ch-h,r=Math.min(3,bw/2,h);
      s+=`<path class="b${ui.selDay===i+1?' sel':''}" d="M${x},${top+ch}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${top+ch}Z"/>`;}
    if(!cur||i+1<=today)s+=`<rect class="hit" data-day="${i+1}" x="${i*slot}" y="0" width="${slot}" height="${H}"/>`;
  });
  s+=`<line class="ax" x1="0" x2="${W}" y1="${top+ch+.5}" y2="${top+ch+.5}"/>`;
  for(const dd of [1,10,20,N])s+=`<text x="${(dd-.5)*slot}" y="${H-4}" text-anchor="middle">${dd}</text>`;
  return s+'</svg>';
}

function openPanel(id){$('#scrim').classList.add('on');$(id).classList.add('on');haptic()}
function closeSheet(){$('#scrim').classList.remove('on');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));document.activeElement?.blur()}
function openSheet(id,type='exp'){
  ui.fType=type; ui.editId=id||null;
  const list=type==='inc'?S.extra:S.expenses; const e=id&&list.find(x=>x.id===id);

  $('#fAmount').value=e?String(e.amount).replace('.',','):'';
  $('#fDesc').value=e?e.desc:'';

  ui.fCat=e&&type==='exp'?e.cat:null; ui.fManual=!!e; ui.fGuess=e&&type==='exp'?guess(e.desc):null;
  $('#fDel').hidden=!e; $('#fType').hidden=!!e;
  applyType(); renderRecent(!e&&type==='exp');

function applyType(){
  const inc=ui.fType==='inc';

  $('#fCats').hidden=inc; $('#fGuess').hidden=inc; $('#recent').hidden=inc||!$('#recent').innerHTML;
  renderChips();
}
let lastChip=null;
function renderChips(){
  const g=$('#fGuess');
  if(ui.fCat){const c=cat(ui.fCat);g.innerHTML=`→ <b>${c.emoji} ${esc(c.name)}</b> ${ui.fManual?'':'<span class="muted">(авто, можно поменять ниже)</span>'}`}
  else g.innerHTML='<span class="muted">Категорию подберу по описанию ✨</span>';
  if(ui.fCat&&ui.fCat!==lastChip&&!ui.fManual)haptic();
  lastChip=ui.fCat;
  const chip=c=>`<button class="chip${ui.fCat===c.id?' on':''}" data-fcat="${esc(c.id)}">${c.emoji} ${esc(c.name)}${ui.fCat===c.id&&!ui.fManual?'<span class="auto">авто</span>':''}</button>`;
  $('#fCats').innerHTML=`<div class="grp">Повседневные</div>${S.categories.filter(c=>c.kind!=='fixed').map(chip).join('')}
    <div class="grp">Обязательные</div>${S.categories.filter(c=>c.kind==='fixed').map(chip).join('')}`;
}
function renderRecent(show){
  const box=$('#recent'); if(!show){box.hidden=true;box.innerHTML='';return}
  const seen=new Map();
  for(const e of [...S.expenses].filter(e=>!e.debtId).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,80)){
    const n=norm(e.desc); if(!n)continue; const r=seen.get(n)||{e,c:0}; r.c++; seen.set(n,r);
  }
  const top=[...seen.values()].sort((a,b)=>b.c-a.c).slice(0,8);
  box.hidden=!top.length;
  box.innerHTML=top.map(({e})=>`<button class="chip" data-recent="${e.id}">${cat(e.cat).emoji} ${esc(e.desc)} · ${money(e.amount)}</button>`).join('');
}
function saveForm(){
  const amount=parseAmount($('#fAmount').value);
  if(!(amount>0)){toast('Введи сумму');haptic('warn');$('#fAmount').focus();return}
  const desc=$('#fDesc').value.trim(), date=$('#fDate').value||todayStr();
  if(ui.fType==='inc'){
    if(ui.editId)Object.assign(S.extra.find(x=>x.id===ui.editId),{amount,desc,date});
    else S.extra.push({id:uid(),amount,desc,date,ts:Date.now()});
    save();closeSheet();if(date.slice(0,7)!==ui.month)ui.month=date.slice(0,7);render();
    haptic('success');confettiAt($('#fab'));toast(`💰 Доход ${money(amount)}`);return;
  }
  const c=ui.fCat||guess(desc)||'other', n=norm(desc);
  // запоминаем только то, что база слов не угадала сама
  if(n){if(c!==(dictGuess(n)||'other'))S.learned[n]=c;else delete S.learned[n];
    if(ui.fManual&&ui.fGuess&&ui.fGuess!==c){const t=n.split(' ').find(t=>t.length>=3);if(t)S.learned['w:'+t]=c}}
  let e;
  if(ui.editId){e=S.expenses.find(x=>x.id===ui.editId);
    if(e.cat!==c){delete e.plannedId;delete e.forDue}
    Object.assign(e,{amount,desc,date,cat:c});delete e.demo}
  else{e={id:uid(),amount,desc,date,cat:c,ts:Date.now()};S.expenses.push(e)}
  autoLink(e);
  save(); closeSheet();
  if(date.slice(0,7)!==ui.month)ui.month=date.slice(0,7);
  render(); haptic('success');
  const P=period();
  toast(ui.editId?'Сохранено':`${cat(c).emoji} ${cat(c).name}: ${money(amount)}`+(P&&!isFixed(c)&&date===todayStr()?` · сегодня осталось ${money(Math.max(0,P.todayLeft))}`:''));
  if(persisted===null)askPersist();
}

// Записи в расходах/доходах, связанные с долгом (если включено «учесть в лимите»)
function debtMoney(d,amount,date,isReturn){
  if(!d.affect)return;
  const outflow=(d.dir==='out')!==isReturn; // дал в долг или вернул свой долг — деньги ушли
  const desc=isReturn?(d.dir==='out'?`${d.who} вернул долг`:`Вернул долг: ${d.who}`):(d.dir==='out'?`В долг: ${d.who}`:`Взял в долг: ${d.who}`);
  const rec={id:uid(),amount,desc,date,ts:Date.now(),debtId:d.id,debtInit:!isReturn};
  if(outflow)S.expenses.push({...rec,cat:'transfers'});else S.extra.push(rec);
}
function saveDebt(){
  const amount=parseAmount($('#dAmount').value), who=$('#dWho').value.trim();
  if(!(amount>0)){toast('Введи сумму');haptic('warn');return}
  if(!who){toast('Кому / у кого?');haptic('warn');$('#dWho').focus();return}
  const date=$('#dDate').value||todayStr(), due=$('#dDue').value||'', note=$('#dNote').value.trim();
  if(ui.dEdit){const d=S.debts.find(x=>x.id===ui.dEdit);Object.assign(d,{amount,who,date,due,note});
    for(const r of [...S.expenses,...S.extra])if(r.debtId===d.id&&r.debtInit){r.amount=amount;r.date=date}}
  else{const d={id:uid(),dir:ui.dDir,who,amount,date,due,note,affect:$('#dAffect').checked,returns:[],ts:Date.now()};
    S.debts.push(d);debtMoney(d,amount,date,false)}
  save();closeSheet();render();haptic('success');toast(ui.dEdit?'Сохранено':'🤝 Долг записан');
}
function debtReturn(d,amount,btn){
  const left=debtLeft(d); amount=Math.min(amount,left); if(!(amount>0))return;
  d.returns=d.returns||[]; d.returns.push({amount,date:todayStr()});
  debtMoney(d,amount,todayStr(),true); save();
  const closed=debtLeft(d)<=0;
  haptic('success'); if(closed)confettiAt(btn);
  toast(closed?`🎉 Долг закрыт: ${d.who}`:`Записал: вернули ${money(amount)}`);
}

/* ---------- экспорт / импорт ---------- */
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function shareOrDownload(name,text,type){
  const blob=new Blob([text],{type});
  if(isIOS&&navigator.canShare){
    const file=new File([blob],name,{type});
    if(navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return true}catch(e){if(e.name==='AbortError')return false}
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true;
}
async function backup(){
  const ok=await shareOrDownload(`rashody-${todayStr()}.json`,JSON.stringify({app:'rashody',v:3,exportedAt:new Date().toISOString(),data:S},null,1),'application/json');
  if(ok){S.lastBackup=Date.now();save();render();haptic('success');toast('Копия сохранена')}
}
function exportCSV(){
  const rows=[['Дата','Тип','Категория','Описание','Сумма']];
  for(const e of [...S.expenses].sort((a,b)=>a.date.localeCompare(b.date)))rows.push([e.date,e.debtId?'Долг':isFixed(e.cat)?'Обязательный':'Расход',cat(e.cat).name,e.desc,String(e.amount).replace('.',',')]);
  for(const e of S.extra)rows.push([e.date,e.debtId?'Долг (приход)':'Доход','',e.desc,String(e.amount).replace('.',',')]);
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  shareOrDownload(`rashody-${todayStr()}.csv`,csv,'text/csv');
}
async function importFile(file){
  try{
    const j=JSON.parse(await file.text()); const d=migrate(structuredClone(j.data||j));
    if(!Array.isArray(d.expenses))throw new Error('bad');
    const okRow=e=>e&&e.id&&e.amount>0&&/^\d{4}-\d\d-\d\d$/.test(e.date);
    let added=0;
    const merge=(dst,src)=>{const ids=new Set(dst.map(x=>x.id));for(const e of src||[])if(okRow(e)&&!ids.has(e.id)){dst.push(e);added++}};
    merge(S.expenses,d.expenses); merge(S.extra,d.extra);
    for(const c of d.categories||[])if(c&&c.id&&!catExists(c.id))S.categories.push(c);
    const mergeCfg=(dst,src)=>{const ids=new Set(dst.map(x=>x.id));for(const x of src||[])if(x&&x.id&&!ids.has(x.id)&&x.amount>0)dst.push(x)};
    mergeCfg(S.planned,d.planned); mergeCfg(S.debts,d.debts);
    if(!monthlyIncome()&&d.incomes.some(i=>i.amount>0))S.incomes=d.incomes;
    Object.assign(S.learned,d.learned||{}); if(!S.budget&&d.budget)S.budget=d.budget; if(!S.saveMonthly&&d.saveMonthly)S.saveMonthly=d.saveMonthly;
    save();render();toast(`Добавлено записей: ${added}`);
  }catch(e){toast('Не получилось прочитать файл')}
}

    ['Долями',2400,5,'installments',4800],['ЖКХ',5200,10,'utilities'],['МТС',650,5,'comm'],['Яндекс Плюс',399,12,'subs']];

    if(!we&&Math.random()<.35)add(pick(['Обед','Бизнес-ланч','Шаурма']))(r(300,650));
    if(Math.random()<(cur?.25:.15))add(pick(['Такси','Яндекс Го']))(r(250,700));
    if(Math.random()<.08)add(pick(['Бензин АИ-95','Заправка Лукойл','Мойка']))(r(600,2500));
    if(we&&Math.random()<.35)add(pick(['Ресторан','Суши','Пицца','Бар с друзьями']))(r(900,2600));
    if(we&&Math.random()<.2)add(pick(['Кино','Боулинг','Концерт']))(r(500,2500));
    if(Math.random()<.04)add(pick(['Ozon','Wildberries','Кроссовки','Футболка','Наушники']))(r(700,4500));
    if(Math.random()<.06)add(pick(['Капли в нос','Аптека','Нурофен','Витамины']))(r(250,1200));
    if(Math.random()<.04)add(pick(['Стрижка','Шампунь']))(r(400,1500));
    if(Math.random()<.05)add(pick(['Корм коту','Наполнитель']))(r(400,1600));
  }
  S.expenses=S.expenses.filter(e=>!e.demo).concat(out);
  if(!S.debts.length){
    const dd=n=>ymd(new Date(Date.now()+n*DAY));

    for(const e of [...S.expenses,...S.extra])if(e.debtId)e.demo=true;
  }

  if(t.dataset.inc){openSheet(t.dataset.inc,'inc');return}
  if(t.dataset.pay){const p=S.planned.find(x=>x.id===t.dataset.pay);
    S.expenses.push({id:uid(),amount:p.amount,desc:p.name||cat(p.cat).name,date:todayStr(),cat:p.cat,ts:Date.now(),plannedId:p.id,forDue:t.dataset.due});
    save(); haptic('success'); confettiAt(t);
    const li=loanInfo(p);
    keepScroll(renderHome); toast(li&&li.done?`🎉 ${p.name||'Кредит'} полностью выплачен!`:`✓ ${p.name||cat(p.cat).name} оплачен`);return}
  if(t.dataset.day){const d=Number(t.dataset.day);ui.selDay=ui.selDay===d?null:d;haptic();keepScroll(renderHome);return}
  if(t.dataset.kind){const c=S.categories.find(x=>x.id===t.dataset.kind);c.kind=c.kind==='fixed'?'var':'fixed';save();haptic();keepScroll(renderSettings);return}
  if(t.dataset.del){const [arr,id]=t.dataset.del.split(':');S[arr]=S[arr].filter(x=>x.id!==id);save();haptic('warn');keepScroll(renderSettings);return}
  if(t.dataset.delcat){const id=t.dataset.delcat;if(!confirm('Удалить категорию? Её траты перейдут в «Другое».'))return;
    S.categories=S.categories.filter(c=>c.id!==id);S.expenses.forEach(e=>{if(e.cat===id)e.cat='other'});
    for(const k in S.learned)if(S.learned[k]===id)delete S.learned[k];save();keepScroll(render);return}
  switch(t.dataset.act){
    case 'clearcat':ui.catFilter=null;render();break;
    case 'backup':backup();break;
    case 'csv':exportCSV();break;
    case 'import':$('#importFile').click();break;
    case 'addinc':S.incomes.push({id:uid(),name:'',amount:0,day:0});save();keepScroll(renderSettings);haptic();
      document.querySelectorAll('[data-bind^="incomes:"][data-bind$=":name"]').forEach((el,i,a)=>{if(i===a.length-1)el.focus()});break;
    case 'addplan':S.planned.push({id:uid(),name:'',amount:0,day:1,cat:'loans'});save();keepScroll(renderSettings);haptic();
      document.querySelectorAll('[data-bind^="planned:"][data-bind$=":name"]').forEach((el,i,a)=>{if(i===a.length-1)el.focus()});break;
    case 'addcat':{const n=$('#ncN').value.trim();if(!n){toast('Введи название');return}
      const oi=S.categories.findIndex(c=>c.id==='other');
      S.categories.splice(oi,0,{id:'c'+uid(),name:n,emoji:$('#ncE').value.trim()||'🏷️',kind:'var'});save();keepScroll(render);haptic('success');toast('Категория добавлена');break}
    case 'demo':loadDemo();save();ui.view='home';window.scrollTo(0,0);render();haptic('success');toast('Демо-данные загружены');break;
    case 'undemo':{const demoPlans=new Set(S.planned.filter(p=>p.demo).map(p=>p.id)), demoDebts=new Set(S.debts.filter(d=>d.demo).map(d=>d.id));
      S.expenses=S.expenses.filter(e=>!e.demo&&!demoDebts.has(e.debtId));S.extra=S.extra.filter(e=>!demoDebts.has(e.debtId));
      S.incomes=S.incomes.filter(e=>!e.demo);S.planned=S.planned.filter(p=>!demoPlans.has(p.id));S.debts=S.debts.filter(d=>!d.demo);
      save();render();toast('Демо-данные удалены');break}
    case 'wipe':if(confirm('Удалить ВСЕ траты и настройки? Это нельзя отменить.')){S=freshState();ensureIncomeSlots(S);save();render();toast('Всё удалено')}break;
  }
});
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
document.addEventListener('mouseover',ev=>{const r=ev.target.closest?.('rect.hit');if(!r||!matchMedia('(hover:hover)').matches)return;
  const d=Number(r.dataset.day);if(ui.selDay!==d){ui.selDay=d;updateChartTip()}});
let adviceTimer;
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='fDesc'){ui.fGuess=guess(el.value);if(!ui.fManual)ui.fCat=ui.fGuess;renderChips();return}
  if(el.id==='search'){ui.search=el.value;renderHistory();return}
  const b=el.dataset?.bind; if(!b)return;
  if(b==='saveMonthly'||b==='budget'){const v=parseAmount(el.value);S[b]=v>0?v:0}
  else{
    const [arr,id,field]=b.split(':'); const row=S[arr].find(x=>x.id===id); if(!row)return;
    if(field==='amount'){const v=parseAmount(el.value);row.amount=v>0?v:0}
    else if(field==='total'){const v=parseAmount(el.value);row.total=v>0?v:0;row.totalTs=Date.now()}
    else if(field==='day'){const v=parseInt(el.value,10);row.day=v>=1&&v<=31?v:0}
    else row[field]=el.value;
    if(arr==='planned'&&field==='name'&&!row.catTouched&&el.value.trim()){const g=guess(el.value);if(g&&isFixed(g)){row.cat=g;const s=el.closest('.srow')?.querySelector('select');if(s)s.value=g}}
    if(arr==='planned'&&field==='cat')row.catTouched=true;
  }
  save();
  // подсказку по копилке пересчитываем на лету, не трогая поля ввода
  if(ui.view==='settings'){clearTimeout(adviceTimer);adviceTimer=setTimeout(()=>{const a=$('#saveAdvice');if(a)a.innerHTML=saveAdviceHtml()},250)}
});
document.addEventListener('change',ev=>{
  const b=ev.target.dataset?.bind||'';
  if(b.endsWith(':cat'))ev.target.dispatchEvent(new Event('input',{bubbles:true}));
  if(b.endsWith(':total')&&ui.view==='debts')keepScroll(renderDebts);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&(ev.target.id==='fAmount'||ev.target.id==='fDesc')){ev.preventDefault();
    if(ev.target.id==='fAmount')$('#fDesc').focus();else saveForm()}
  if(ev.key==='Escape')closeSheet();
});
$('#scrim').addEventListener('click',closeSheet);
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&ui.view!=='settings')render()});

/* ---------- старт ---------- */
(async()=>{
  S=freshState(); compileKW();
  S=migrate(await loadState());
  save(); render();
  if(S.expenses.length)askPersist().then(()=>ui.view==='settings'&&render());
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
    navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
